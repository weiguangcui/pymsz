# Build pymsz for PyPI and publish it.
#
#   Actions tab -> "release" -> "Run workflow"   builds everything and uploads it to TestPyPI (a trial)
#   git tag v1.0 && git push origin v1.0          builds everything and publishes it on PyPI
#
# It builds the source distribution and binary wheels (Linux x86_64 and aarch64, macOS arm64; Python
# 3.10-3.14, configured in pyproject.toml [tool.cibuildwheel]); every wheel is tested before upload.
# Publishing uses PyPI "trusted publishing": no password or token is stored in GitHub. Set it up once
# on pypi.org and test.pypi.org (see docs/contributing.md, "Releasing a new version").
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    name: source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true    # the SZpack sources go into the sdist
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check that the tag matches the version in setup.py
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import re; t = open('setup.py').read(); print('.'.join(re.search(r'^%s = (\d+)' % k, t, re.M).group(1) for k in ('MAJOR', 'MINOR')))")
          [ "${GITHUB_REF_NAME}" = "v$v" ] || { echo "::error::tag ${GITHUB_REF_NAME} does not match version $v in setup.py"; exit 1; }
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install cibuildwheel
      - run: python -m cibuildwheel --output-dir wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  testpypi:
    name: upload to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write         # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    name: publish on PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write         # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
